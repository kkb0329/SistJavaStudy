<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
 <link href="https://fonts.googleapis.com/css2?family=Dongle&family=Gaegu&family=Hi+Melody&family=Nanum+Myeongjo&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<title>Insert title here</title>
</head>
<body>
<h2>InfoToXml ajax함수이용해서 읽기</h2>
<button type="button" class="btn btn-success"
id="btnInfo">InfoToXml</button>
<div id="show"></div>
<script type="text/javascript">
  $("#btnInfo").click(function(){
	  
	  $.ajax({
		  type:"get",
		  url:"infotoxml.jsp",
		  dataType:"xml",
		  success:function(res){
			  
			  var s="";
			  $(res).find("info").each(function(i,ele){
				  
				  var n=$(ele);
				  s+="<div class='alert alert-danger' style='width:300px;'>";
				  s+="<img src='"+n.find("photo").text()+"' width='100'><br>";
				  s+="No. : "+n.attr("num")+"<br>";
				  s+="이름: "+n.find("name").text()+"<br>";
				  s+="연락처: "+n.find("hp").text()+"<br>";
				  s+="나이: "+n.find("age").text()+"<br>";
				  s+="</div>";
			  })
			  
			  $("#show").html(s);
			  alert("JSON 버튼 클릭됨!");
		  }
	  })
  });

</script>
</body>
</html>
