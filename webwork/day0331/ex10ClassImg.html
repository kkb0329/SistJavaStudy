<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Dongle&family=Gaegu&family=Hi+Melody&family=Nanum+Myeongjo&family=Nanum+Pen+Script&display=swap" rel="stylesheet">

    <title>Document</title>
    <style>
        div.a{
            font-size: 2em;
            font-family: 'Dongle';
        }

        div.b>figure{
            float: left;  /* 가로방향 정렬 */
        }

        div.b img{width: 200px; height: 200px;}

        h3.c{clear: both;} /*  float: left;속성을 헤제 */

        div.d{
            display: flex;
            flex-direction: row;
            /* row: 왼쪽정렬,row-reverse :오른쪽정렬 column:세로정렬렬 */
        }

        div.d img{
            border: 2px solid greenyellow;
            box-shadow: 15px 15px 15px gray;
            border-radius: 10px 40px 80px 20px; /*왼쪽 상단모서리부터 시계방향*/
        }

    </style>
</head>
<body>
    <img src="../Food/5.jpg" width="200" border="1" align="left" hspace="20">
    <div class="a">
        순두부찌개<br>콘치즈<br>샌드위치<br>망고빙수<br>
    </div>
    <hr>
    <div class="b">
        <figure>
            <img src="../Food/1.jpg" >
            <figcaption><b>에그 토마토 샌드위치</b></figcaption>
        </figure>

        <figure>
            <img src="../Food/11.jpg" >
            <figcaption><b>망고빙수</b></figcaption>
        </figure>

        <figure>
            <img src="../Food/9.jpg" >
            <figcaption><b>우엉조림림</b></figcaption>
        </figure>

        <h3 class="c">안녕하세요 html2일차</h3>
    </div>

    <div class="d">
        <figure>
            <img src="../연예인사진/10.jpg" width="150">
            <figcaption><b>김태희</b></figcaption>
        </figure>
        <figure>
            <img src="../연예인사진/11.jpg" width="150">
            <figcaption><b>고준희</b></figcaption>
        </figure>
        <figure>
            <img src="../연예인사진/12.jpg" width="150">
            <figcaption><b>박보영</b></figcaption>
        </figure>
    </div>
</body>
</html>
