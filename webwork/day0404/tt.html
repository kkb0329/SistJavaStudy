<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Document</title>
</head>
<style>
    #result {
        width: 1000px;
        height: 500px;
        background-color: bisque;
    }
    .imgs{
        width: 120px;
        height: 120px;
        border: 2px solid gray;
        border-radius: 20px;
        margin-right: 10px;
    }
</style>
    <script>
        var imgarrs = new Array(); // 배열생성
        //배열에 들어갈 데이터 입력
        function imgarr(){
            var n = Number(prompt("출력할 만화이미지 갯수를 입력하세여"));
            for(var i = 0; i < n; i++){
                var s = Number(prompt((i+1)+"번째 이미지 번호를 입력하세여"));
                if (s < 10)
                imgarrs.push("../만화이미지/0" + s +".png")
                else 
                imgarrs.push("../만화이미지/" + s +".png")
            }
            
            //만화이미지 출력
            document.getElementById('result').innerHTML="이미지 갯수 = " + imgarrs.length + "<br><br>"; //
            for(var i = 0; i < imgarrs.length; i++){
                document.getElementById('result').innerHTML +="<img src = '" + imgarrs[i] + "' class = 'imgs'>";
                if((i+1) % 5 ==0){
                  document.getElementById('result').innerHTML += "<br><br>";
            }
            console.log(document.getElementById('result').innerHTML); //로그 확인
        }
    }
    </script>
<body>
    <button id="btnImg" class = "btn btn-info" type ="button" onclick="imgarr()">이미지 출력</button>
    <hr>
    <div id="result">이미지 출력하는곳</div>;
</body>
</html>
