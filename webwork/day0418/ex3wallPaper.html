<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Dongle&family=Gaegu&family=Hi+Melody&family=Nanum+Myeongjo&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>

    <title>Document</title>
    <style>
        body{background-color: #fff;}
        div.wall{
            width: 800px;
            height: 600px;
            background-color: #999;
            position: relative;

        }

        h1.title{
            font-size: 2em;
            position: absolute;
            right: 30px;
            top: 60px;
            width: 150px;

        }

        ul.list{
            position: absolute;
            width: 100%;
            height: 100px;
            left: 0;
           

        }

        ul.list li{
            float: left;
            cursor: pointer;
            width: 70px;
            height: 70px;
            border: 5px solid #ccc;
            border-radius: 10px;
            margin-right: 5px;
            list-style: none;
            
        }
        ul.list li img{
            width: 100%;
        }

        /*제이쿼리서 사용할 클래스*/
        ul.list li.active{
            border-color: tomato;
        }
    </style>
    <script>
        $(function(){

            //샘플벽지클릭시 li에 active클래스 추가하기
            $(".list li img").click(function(){


                //현재클릭한 이미지의 부모li에 active추가
                $(this).parent().addClass("active");
                //부모클래스의 형제태그에 들어있는 active제거
                $(this).parent().siblings().removeClass("active");

            //클릭한 이미지 title속성값 얻어서 h1 벽지명에 넣기
               var title= $(this).attr("title");
               $("h1.title").html(title);

            //뒤의 벽에 이미지 적용되기
            var imgSrc=$(this).attr("src");

            $("div.wall").css("background-image","url('"+imgSrc+"')");

            });

            
        })
    </script>
</head>
<body>
    <div class="wall">
        <h1 class="title">벽지명</h1>
        <img src="../jquery_img/cover2.png">
        <ul class="list">
            <li><img src="../jquery_img/b01.png" title="Pear"></li>
            <li><img src="../jquery_img/b02.png" title="Check"></li>
            <li><img src="../jquery_img/b03.png" title="Bamboo"></li>
            <li><img src="../jquery_img/b04.png" title="Pencil"></li>
            <li><img src="../jquery_img/b05.png" title="Leaf"></li>
            <li><img src="../jquery_img/b06.png" title="Forest"></li>
        </ul>
    </div>
</body>
</html>
