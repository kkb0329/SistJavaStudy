<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Dongle&family=Gaegu&family=Hi+Melody&family=Nanum+Myeongjo&family=Nanum+Pen+Script&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <title>Document</title>


    <style>
        li {
            list-style: none;
        }


        #sunban_wrapper {

            width: 800px;
            margin: 0 auto;
            margin-top: 200px;


        }

        #control_wrapper {
            width: 300px;
            height: 250px;
            position: absolute;
            top: 20%;
            


            /* transform: translateY(-100%); */
        }

        .sunban {

            width: 790px;
            height: 150px;
            background: url("../jquery_img/sunban.png")no-repeat center bottom;
            margin-bottom: 50px;

        }

        .sunban li {
            float: left;
            width: 120px;
            height: 120px;
            cursor: pointer;


        }

        .gun {

            width: 300px;
            height: 250px;
            background: url("../jquery_img/gun.png");
            cursor: pointer;
            text-indent: -100px;
        }

        .gun:active {

            background-position: right bottom;


        }

        #msg {

            font-family: 'Nanum Pen Script';
            position: absolute;
            left: 700px;
            top: 700px;
            width: 500px;
            height: 100px;
            font-size: 30px;
            border: 10px solid pink;
            text-align: center;
            line-height: 100px;

        }

        body {


            background: url("../jquery_img/bg.png");
            overflow: hidden;

        }
    </style>


    <script>
        $(function () {
            var fire = new Audio("../fire.wav");

            $(".gun").click(function () {
                fire.play();

                var n = parseInt(Math.random() * $(".sunban li img").length);
                console.log("랜덤 숫자:", n);

                var targetImg = $(".sunban li img").eq(n);

                if (targetImg.is(":visible")) {
                    targetImg.hide();
                    $("#msg").text("명중!");
                } else {
                    $("#msg").text(`${n + 1}번째 표적은 이미 사라진 표적입니다!`);
                }
                
                if ($(".sunban li img:visible").length === 0) {
                $("#msg").text("너가 이겼어!");
            }

            
            });

            $(".money li").click(function () {
                $(this).remove();

                $(".sunban li img").show();
                $("#msg").text("모든 표적이 리셋되었습니다!");

                if ($(".money li").length === 0) {
                    $("#msg").text(" (돈이 모두 소진되었습니다!)");
                }
            });

        });

    </script>



</head>

<body>

    <div id="sunban_wrapper">


        <ul class="sunban">

            <li><img src="../jquery_img/01.png"></li>
            <li><img src="../jquery_img/02.png"></li>
            <li><img src="../jquery_img/03.png"></li>
            <li><img src="../jquery_img/04.png"></li>
            <li><img src="../jquery_img/05.png"></li>
            <li><img src="../jquery_img/06.png"></li>

        </ul>

        <ul class="sunban">

            <li><img src="../jquery_img/07.png"></li>
            <li><img src="../jquery_img/08.png"></li>
            <li><img src="../jquery_img/09.png"></li>
            <li><img src="../jquery_img/10.png"></li>
            <li><img src="../jquery_img/11.png"></li>
            <li><img src="../jquery_img/12.png"></li>

        </ul>

    </div>

    <div id="control_wrapper">
        <div class="gun">총</div>

        <ul class="money">

            <li><img src="../jquery_img/money.png"></li>
            <li><img src="../jquery_img/money.png"></li>
            <li><img src="../jquery_img/money.png"></li>


        </ul>
    </div>

    <div id="msg"></div>

</body>

</html>
