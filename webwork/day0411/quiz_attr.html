<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Dongle&family=Gaegu&family=Hi+Melody&family=Nanum+Myeongjo&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <link rel="stylesheet" href="../css/lottoStyle.css">
    <title>Document</title>
</head>
<body>

    <!-- 로또공에 랜덤색상을 적용하고 그배경색을 h2에 출력할것(rgb(255,255,255)) each-->
    <div class="lotto">7</div><div class="lotto">5</div><div class="lotto">26</div><div class="lotto">32</div><div class="lotto">38</div><div class="lotto">42</div>

    <h2></h2>


    <script>
        $(function () {
            let colors = [];

            $(".lotto").each(function () {
                
                let r = Math.floor(Math.random() * 256);
                let g = Math.floor(Math.random() * 256);
                let b = Math.floor(Math.random() * 256);
                let rgb = `rgb(${r}, ${g}, ${b})`;

                
                $(this).css("background-color", rgb);

                
                colors.push(rgb);
            });

            
            $("h2").text("배경색 목록: " + colors.join(", "));
        });
    </script>
</body>
</html>
